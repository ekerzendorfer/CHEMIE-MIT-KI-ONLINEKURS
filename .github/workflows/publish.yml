name: publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Repository laden
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: MkDocs und Plugins installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install mkdocs-material mkdocs-glightbox

      - name: MkDocs-Konfiguration prüfen
        run: |
          mkdocs build --clean --verbose

      - name: GitHub Pages veröffentlichen
        run: |
          mkdocs gh-deploy --force --clean
