site_name: CHEMIE mit KI - Onlinekurs
site_description: Interaktive Materialien für den Chemieunterricht

theme:
  name: material
  language: de
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.path
    - navigation.top
  palette:
    primary: indigo
    accent: deep orange

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Startseite - Linkhub - Kompass: index.md
  - NAWI - KI aktuell 🚀: aktuell.md

  - Kapitel 1 - KI-Assistenten und Agenten:
      - ki-assistenten/index.md
      - Grundlagen und Praxis:
          - Eigene KI-Assistenten erstellen: ki-assistenten/assistenten-erstellen.md
          - Custom GPTs und Gems: ki-assistenten/gems.md
      - Chat, Assistent oder Agent?:
          - Grundidee und Einordnung: ki-assistenten/chat-assistent-agent.md
          - Praxisbeispiel Elektronegativität: ki-assistenten/elektronegativitaet-bindungspolaritaet.md
      - Weitere Werkzeuge:
          - NotebookLM im NaWi-Alltag: ki-assistenten/notebooklm.md
          - Prompten lernen mit ROKA: ki-assistenten/prompten-roka.md

  - Kapitel 2 - Die Basis-Tools: kapitel2.md
  - Kapitel 3 - App in der Freistunde: kapitel3.md

  - Kapitel 4 - Moleküllabore:
      - Überblick: molekuellabore/index.md
      - MOL_LAB DIDACTIC: molekuellabore/mol_lab_didactic.md
      - Lernpfade: molekuellabore/lernpfade.md
      - MOL_LAB scientific: molekuellabore/mol_lab_scientific.md

  - Viewer für Strukturdateien: viewer.md

plugins:
  - search
  - glightbox
