site_name: CHEMIE mit KI - Onlinekurs
site_description: Interaktive Materialien für den Chemieunterricht

theme:
  name: material
  language: de
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.path
    - navigation.top
  palette:
    primary: indigo
    accent: deep orange

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed:
      alternate_style: true

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Startseite - Linkhub - Kompass: index.md
  - NAWI - KI aktuell 🚀: aktuell.md

  - Kapitel 1 - KI-Assistenten und Agenten:
      - ki-assistenten/index.md
      - Grundlagen und Praxis:
          - Eigene KI-Assistenten erstellen: ki-assistenten/assistenten-erstellen.md
          - Custom GPTs und Gems: ki-assistenten/gems.md
      - Chat, Assistent oder Agent?:
          - Grundidee und Einordnung: ki-assistenten/chat-assistent-agent.md
          - Praxisbeispiel Elektronegativität: ki-assistenten/elektronegativitaet-bindungspolaritaet.md
      - Weitere Werkzeuge:
          - NotebookLM im NaWi-Alltag: ki-assistenten/notebooklm.md
          - Prompten lernen mit ROKA: ki-assistenten/prompten-roka.md

  - Kapitel 2 - Die Basis-Tools: kapitel2.md
  - Kapitel 3 - App in der Freistunde: kapitel3.md

  - Kapitel 4 - Analytische und Physikalische Chemie:
      - TITRATIONS - TOOL: analytik/titrationstool.md
      - IONENFISCHEN virtuell: analytik/Ionenfischen.md
      
      - SpektralLab – Virtuelles Photometer:
          - Überblick: analytik/virtuelles-photometer.md
          - Grundlagen der Photometrie: analytik/photometrie-grundlagen.md
          - Das schematische Photometer: analytik/photometer-geraeteschema.md
          - Spektren aufnehmen: analytik/photometrie-spektren.md
          - Eichkurven und unbekannte Proben: analytik/photometrie-eichkurven.md
          - Messrealismus und Fehlerkultur: analytik/photometrie-fehlerkultur.md
          - pH-abhängige Spektren: analytik/photometrie-gleichgewicht.md
          - Photometrische Kinetik: analytik/photometrie-kinetik.md
          - Aufgaben und Protokoll: analytik/photometrie-aufgaben-protokoll.md
          - Datenexport und Weiterverarbeitung: analytik/photometrie-datenexport.md
          - Quellen und Modellgrenzen: analytik/photometrie-quellen-modellgrenzen.md
          
      - DATEN-LAB: analytik/messwert-lab.md

  - Kapitel 5 - Moleküllabore:
      - Überblick: molekuellabore/index.md
      - MOL_LAB DIDACTIC: molekuellabore/mol_lab_didactic.md
      - Lernpfade: molekuellabore/lernpfade.md
      - MOL_LAB scientific: molekuellabore/mol_lab_scientific.md

  - Kapitel 6 - Proteinfaltung:
      - Überblick: proteinfaltung/index.md
      - KI-Strukturmodell-Labor: proteinfaltung/KI_Strukturmodelllabor.md

  - Viewer für Strukturdateien: viewer.md

plugins:
  - search
  - glightbox
